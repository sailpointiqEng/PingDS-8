---
# Ping DS 8 install = unzip only (ready for setup); do NOT run setup
- name: "LOG | Install - Starting (unzip only; no setup)"
  ansible.builtin.debug:
    msg: "Phase: Install. Steps: check if already unzipped, ensure path, copy ZIP if needed, unzip, set ownership to opendj."
  changed_when: false

- name: Check if Ping DS is already unzipped (ready for setup)
  ansible.builtin.stat:
    path: "{{ ds_install_path }}/setup"
  register: _ds_setup
  vars:
    ds_install_path: "{{ ds_install_path | default('/opt/apps/opendj') }}"

- name: Set pingds_unzipped fact
  ansible.builtin.set_fact:
    pingds_unzipped: "{{ _ds_setup.stat.exists | default(false) }}"

- name: Ensure install base path exists (/opt/apps)
  ansible.builtin.file:
    path: "{{ ds_install_base | default(ds_install_path.rsplit('/', 1)[0]) }}"
    state: directory
    mode: "0755"
  when: not pingds_unzipped

- name: Copy DS ZIP to host (if using project file)
  ansible.builtin.copy:
    src: "{{ ds_zip_name }}"
    dest: "{{ ds_zip_path }}"
    mode: "0644"
  when: not pingds_unzipped and ds_zip_name is defined
  ignore_errors: true

- name: Unzip DS distribution to {{ ds_install_base }} (result {{ ds_install_path }})
  ansible.builtin.unarchive:
    src: "{{ ds_zip_path }}"
    dest: "{{ ds_install_base | default(ds_install_path.rsplit('/', 1)[0]) }}"
    remote_src: true
    creates: "{{ ds_install_path }}/setup"
  when: not pingds_unzipped

- name: Set ownership of DS install path to opendj
  ansible.builtin.file:
    path: "{{ ds_install_path }}"
    state: directory
    owner: "{{ pingds_install_user | default('opendj') }}"
    group: "{{ pingds_install_group | default('opendj') }}"
    recurse: true
  when: not pingds_unzipped

- name: Report install skipped (already unzipped)
  ansible.builtin.debug:
    msg: "Ping DS already unzipped at {{ ds_install_path }}. Ready for setup. Skipping."
  when: pingds_unzipped
