---
# Host preparation for Ping DS 8 (config store)
- name: "LOG | Host prepare - Starting (JDK 17, opendj user/group, /opt/apps)"
  ansible.builtin.debug:
    msg: "Phase: Host prepare. Steps: gather facts, disk check, JDK 17 verify/install, create opendj user/group, create /opt/apps and /opt/apps/opendj, firewall, NTP."
  changed_when: false

- name: Gather facts
  ansible.builtin.setup:
    gather_subset: minimal

- name: Get free disk space (KB) for install path
  ansible.builtin.shell: "df -k {{ (ds_install_path | default('/opt/apps/opendj')).rsplit('/', 1)[0] | default('/opt') }} | tail -1 | awk '{print $4}'"
  register: _df_kb
  changed_when: false

- name: Assert sufficient disk space (min {{ pingds_min_disk_free_gb }} GB)
  ansible.builtin.assert:
    that: (_df_kb.stdout | int) >= (pingds_min_disk_free_gb * 1024 * 1024)
    fail_msg: "Insufficient disk space. Need at least {{ pingds_min_disk_free_gb }} GB free."

- name: Get current Java version (for verify-then-skip)
  ansible.builtin.command: "java -version"
  register: _java_version
  changed_when: false
  failed_when: false

- name: Set fact - JDK 17 already present (skip install)
  ansible.builtin.set_fact:
    pingds_java_ok: "{{ (_java_version.stderr | default('')) + (_java_version.stdout | default('')) is search('version \"' ~ (pingds_java_version_required | default('17')) ~ '\"') }}"

- name: Ensure Java is installed (skip if required version already present)
  ansible.builtin.package:
    name: "{{ pingds_java_packages }}"
    state: present
  when:
    - pingds_java_packages is defined and pingds_java_packages | length > 0
    - not (pingds_java_ok | default(false))

- name: Report Java skip (JDK 17 already installed)
  ansible.builtin.debug:
    msg: "JDK {{ pingds_java_version_required | default('17') }} already present. Skipping Java install."
  when: pingds_java_ok | default(false)

- name: Create group opendj
  ansible.builtin.group:
    name: "{{ pingds_install_group }}"
    state: present
  when: pingds_install_group is defined

- name: Create user opendj (no login)
  ansible.builtin.user:
    name: "{{ pingds_install_user }}"
    group: "{{ pingds_install_group }}"
    create_home: true
    system: true
    shell: "{{ '/usr/sbin/nologin' if ansible_os_family == 'Debian' else '/sbin/nologin' }}"
    state: present
  when: pingds_install_user is defined

- name: Ensure install base path /opt/apps exists and is owned by opendj
  ansible.builtin.file:
    path: "{{ ds_install_base | default('/opt/apps') }}"
    state: directory
    owner: "{{ pingds_install_user | default('opendj') }}"
    group: "{{ pingds_install_group | default('opendj') }}"
    mode: "0755"

- name: Ensure install path exists and is owned by opendj
  ansible.builtin.file:
    path: "{{ ds_install_path | default('/opt/apps/opendj') }}"
    state: directory
    owner: "{{ pingds_install_user | default('opendj') }}"
    group: "{{ pingds_install_group | default('opendj') }}"
    mode: "0755"

- name: Open firewall ports for DS (firewalld)
  ansible.builtin.command: "firewall-cmd --permanent --add-port={{ item }}/tcp"
  loop: "{{ pingds_firewall_ports | default([]) }}"
  when: pingds_firewall_ports is defined and pingds_firewall_ports | length > 0
  changed_when: true
  ignore_errors: true

- name: Reload firewalld
  ansible.builtin.service:
    name: firewalld
    state: reloaded
  when: pingds_firewall_ports is defined and pingds_firewall_ports | length > 0
  ignore_errors: true

- name: Ensure NTP/chrony is running (time sync for replication)
  ansible.builtin.service:
    name: "{{ 'chronyd' if ansible_os_family == 'RedHat' else 'chrony' }}"
    state: started
    enabled: true
  ignore_errors: true
