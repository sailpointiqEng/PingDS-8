[defaults]
# Inventory is managed in Ansible Tower (separate project/source). Do not set here.
roles_path = roles
# Human-readable step-by-step output (each task result shown clearly)
stdout_callback = yaml
# Show all task results in Tower job output (ok, changed, skipped)
display_ok_hosts = true
display_skipped_hosts = true
# For more detail per task (module args, return values), set Job Template Verbosity to 2 or 3 in Tower
# timeout = 30

[privilege_escalation]
# become = true
# become_method = sudo
