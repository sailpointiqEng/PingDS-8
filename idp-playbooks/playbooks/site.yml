---
# Full Ping DS config store deployment (phased: prepare, install, configure, start, replication, validate)
# Use with Tower job template "PingDS – Full", same inventory and credentials.
- name: Full deployment – host prepare, install, configure, start, replication verify, validate
  hosts: pingds_config
  serial: 1  # one host at a time so bootstrap targets exist
  pre_tasks:
    - name: "LOG | Full deployment starting"
      ansible.builtin.debug:
        msg: "Ping DS full deployment starting. Phases: host prepare → install → configure → start → replication verify → validate."
      run_once: true
      changed_when: false
  roles:
    - pingds_host_prepare
    - pingds_install
    - pingds_configure
    - pingds_start
    - pingds_replication_verify
    - pingds_post_deploy_validate
